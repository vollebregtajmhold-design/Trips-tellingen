<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trips tellingen</title>
<style>
:root{--bg:#f3f1ea;--card:#fbfaf6;--tx:#1d2420;--mut:#6b6f68;--ac:#2f7d4f;--ac2:#e3efe6;--bd:#cfccc2;--hd:#b9b7b0;--red:#c0392b;--or:#e2622b;--tot:#e6f2ee}
@media (prefers-color-scheme:dark){:root{--bg:#151816;--card:#1d211e;--tx:#e8ece8;--mut:#9aa49d;--ac:#5cb27e;--ac2:#24372b;--bd:#343a35;--hd:#3a403b;--red:#ff8a80;--or:#ff8a50;--tot:#22322b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}
.hr{display:flex;align-items:center;gap:8px}
#status{font-size:12px;color:var(--mut);text-align:right}
.ib{background:none;border:1px solid var(--bd);border-radius:9px;padding:5px 9px;font-size:17px;cursor:pointer;color:var(--tx)}
main{padding:0 10px 30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px;width:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:10px 0}
.bar select{width:auto}
.btn{padding:10px 14px;border:0;border-radius:9px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
.btn.sec{background:var(--ac2);color:var(--tx)}
.btn.rood{background:none;color:var(--red);border:1px solid var(--red)}
.seg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--tx);padding:8px 11px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.small{font-size:12px;color:var(--mut)}
#instellingen{display:none}#instellingen.on{display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctl{display:inline-flex;flex-direction:column;max-width:100%}
.schuif{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;margin-bottom:8px}
.schuif span{font-size:13px;color:var(--mut)}
.schuif input{flex:1;padding:0;border:0;background:none;accent-color:var(--ac);height:28px}
.schuif b{min-width:26px;text-align:right}
@media (max-width:480px){.bar{gap:6px}.seg button{padding:7px 9px;font-size:13px}.bar select,.btn{font-size:14px;padding:8px 10px}.m .sd{padding:6px 6px}}
/* matrix */
.tw{overflow:auto;max-height:80vh;border:2px solid var(--bd);border-radius:6px;background:var(--card)}
table.m{border-collapse:separate;border-spacing:0;font-size:14px;font-variant-numeric:tabular-nums}
.m th,.m td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:6px 4px;text-align:center;white-space:nowrap;min-width:42px}
.m thead th{position:sticky;top:0;background:var(--hd);z-index:2;font-weight:700}
.m thead th.nu{background:var(--ac);color:#fff}
.m .sd{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;font-weight:700;padding:6px 8px}
.m thead .sd{z-index:3;background:var(--hd)}
.m td.c{cursor:pointer;font-weight:600;color:#1d2420}
.m td.c.leeg{color:var(--mut);font-weight:400}
.m td.c:hover{outline:2px solid var(--ac);outline-offset:-2px}
.m td.c b{display:inline-block;border:2px solid var(--or);border-radius:5px;padding:0 4px;font-weight:600}
.m tr.sep td{border-top:2px solid var(--mut)}
.m tr.tot td{background:var(--tot);font-weight:700;color:var(--tx);cursor:default}
.m tr.tot td.sd{background:var(--tot)}
/* venster */
#venster{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
#venster.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:440px;border-radius:16px 16px 0 0;padding:16px;max-height:92vh;overflow:auto}
@media (min-width:600px){#venster{align-items:center}.sheet{border-radius:16px}}
.kop{display:flex;justify-content:space-between;align-items:center}
.kop b{font-size:18px}
.tag{display:inline-block;background:var(--ac2);border-radius:7px;padding:4px 9px;margin:6px 6px 0 0;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}
.chk input{width:auto}
.knoppen{display:flex;gap:8px;margin-top:14px}
.knoppen .btn{flex:1}
.drie{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vak{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--ac2);font-size:16px;text-align:center;min-height:42px}
.vak.groot{font-weight:700;color:var(--ac)}
.drie input{text-align:center;font-weight:600}
.hint{background:var(--ac2);padding:7px 10px;border-radius:8px;font-size:13px;margin-top:10px}
.warn{color:var(--red);font-size:13px;margin-top:4px}
.kl{width:100%;border-collapse:collapse;font-size:14px}
.kl td{padding:4px 6px;border-bottom:1px solid var(--bd)}
.del{background:none;border:0;color:var(--red);cursor:pointer;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>Trips tellingen</h1>
  <div class="hr"><span id="status"></span><button class="ib" id="ververs" title="Verversen">↻</button><button class="ib" id="tandwiel" title="Instellingen">⚙</button></div>
</header>
<main>

<div class="card" id="instellingen">
  <b>GitHub</b>
  <div class="row">
    <div><label>Gebruiker</label><input id="c_owner"></div>
    <div><label>Repository</label><input id="c_repo"></div>
    <div><label>Branch</label><input id="c_branch" value="main"></div>
    <div><label>Bestand</label><input id="c_path" value="data.json"></div>
  </div>
  <label>Token (alleen nodig om op te slaan)</label><input id="c_token" type="password" autocomplete="off">
  <p><button class="btn" id="bewaar">Bewaren en verbinden</button></p>
  <hr style="border:0;border-top:1px solid var(--bd)">
  <b>Regels (vakken)</b>
  <div class="row">
    <div><label>Locatie</label><input id="k_loc" placeholder="207"></div>
    <div><label>Afdeling</label><input id="k_afd" placeholder="2" inputmode="numeric"></div>
    <div><label>Vak</label><input id="k_vak" placeholder="1" inputmode="numeric"></div>
    <div style="align-self:end"><button class="btn" id="k_add" style="width:100%">+ Regel</button></div>
  </div>
  <div id="k_lijst" style="margin-top:10px"></div>
</div>

<div class="ctl">
<div class="bar">
  <div class="seg" id="modus">
    <button data-m="stand" class="on">Stand</button>
    <button data-m="erbij">Erbij</button>
    <button data-m="dag">Per dag</button>
  </div>
  <select id="f_loc"></select>
  <button class="btn sec" id="csv">⬇ CSV</button>
</div>
<div class="schuif">
  <span>Weken</span>
  <input type="range" id="f_weken" min="1" max="13" value="2">
  <b id="f_wn">2</b>
</div>
</div>

<div class="tw" id="matrix"></div>
<p class="small">Klik op een vakje om een telling in te voeren of te wijzigen. Oranje rand = opmerking of val vervangen.</p>
</main>

<div id="venster">
  <div class="sheet">
    <div class="kop"><b id="v_titel">Telling</b><button class="ib" id="v_sluit">✕</button></div>
    <div id="v_tags"></div>
    <label>Datum</label><input type="date" id="v_datum">
    <div id="v_warn" class="warn" hidden></div>
    <div class="drie">
      <div><label>Vorige stand</label><div class="vak" id="v_vorig">–</div></div>
      <div><label>Stand nu</label><input id="v_aantal" inputmode="decimal" autocomplete="off"></div>
      <div><label>Telling</label><div class="vak groot" id="v_tel">–</div></div>
    </div>
    <div id="v_vorige" class="small" style="margin-top:4px"></div>
    <label class="chk"><input type="checkbox" id="v_vv"> Val vervangen na deze telling</label>
    <label>Opmerking</label><input id="v_opm" autocomplete="off">
    <div class="knoppen">
      <button class="btn rood" id="v_del" hidden>Verwijderen</button>
      <button class="btn" id="v_ok">Opslaan</button>
    </div>
  </div>
</div>

<script>
const LS_DATA='tel_data',LS_CFG='tel_cfg';
const $=id=>document.getElementById(id);
const F=['locatie','afdeling','vak'];
let db=Object.assign({entries:[],kolommen:[],notities:[]},lsGet(LS_DATA)||{});
let cfg=Object.assign({owner:'',repo:'',branch:'main',path:'data.json',token:''},lsGet(LS_CFG)||{});
let modus='stand',timer=null,bezig=false,nogEens=false,open=null,scrollRechts=true;

function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function bewaarLokaal(){lsSet(LS_DATA,db)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toLocaleDateString('sv-SE')}
function nlDate(d){const[y,m,a]=d.split('-');return `${+a}-${+m}-${y}`}
function days(a,b){return Math.round((Date.parse(b)-Date.parse(a))/864e5)}
function fmt(n,d){return n==null||isNaN(n)?'':Number(n).toLocaleString('nl-NL',{maximumFractionDigits:d})}
function setStatus(t){$('status').textContent=t}
function kaal(s){return String(s||'').replace(/^(afd|afdeling|vak)\s*/i,'').trim()}
function key(e){return [e.locatie,kaal(e.afdeling),kaal(e.vak)].map(x=>String(x||'').trim().toLowerCase()).join('|')}
function label(k){return `${k.locatie}-${kaal(k.afdeling)}-${kaal(k.vak)}`}
function cmp(a,b){return String(a).localeCompare(String(b),'nl',{numeric:true})}
/* weeknummers: yw = jaar*100+week (ISO) */
function ywVan(ds){const d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7)+3);const y=d.getUTCFullYear(),j=new Date(Date.UTC(y,0,4));const w=1+Math.round(((d-j)/864e5-3+((j.getUTCDay()+6)%7))/7);return y*100+w}
function ywKort(yw){return String(yw).slice(2)}
function maandagVan(yw){const y=Math.floor(yw/100),w=yw%100,j=new Date(Date.UTC(y,0,4));j.setUTCDate(j.getUTCDate()-((j.getUTCDay()+6)%7)+(w-1)*7);return j.toISOString().slice(0,10)}
function plusDagen(ds,n){const d=new Date(ds+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function ywVanEntry(e){return e.yw||ywVan(e.datum)}

/* ---------- GitHub ---------- */
function b64enc(s){const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=8192)x+=String.fromCharCode(...b.subarray(i,i+8192));return btoa(x)}
function b64dec(s){const x=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(x,c=>c.charCodeAt(0)))}
function ghUrl(){return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`}
function ghHead(acc){const h={Accept:acc||'application/vnd.github+json'};if(cfg.token)h.Authorization='Bearer '+cfg.token;return h}
async function ghGet(){
  const q='?ref='+encodeURIComponent(cfg.branch)+'&t='+Date.now();
  const r=await fetch(ghUrl()+q,{headers:ghHead(),cache:'no-store'});
  if(r.status===404)return{sha:null,data:{}};
  if(!r.ok)throw new Error('lezen mislukt ('+r.status+')');
  const j=await r.json();let txt;
  if(j.content)txt=b64dec(j.content);
  else{const r2=await fetch(ghUrl()+q,{headers:ghHead('application/vnd.github.raw+json'),cache:'no-store'});txt=await r2.text()}
  return{sha:j.sha,data:txt.trim()?JSON.parse(txt):{}};
}
async function ghPut(data,sha){
  const body={message:'Tellingen bijgewerkt',content:b64enc(JSON.stringify(data)),branch:cfg.branch};
  if(sha)body.sha=sha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:Object.assign(ghHead(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(!r.ok){const e=new Error('opslaan mislukt ('+r.status+')');e.status=r.status;throw e}
}
function merge(a,b){const m={};[...(a||[]),...(b||[])].forEach(e=>{if(!m[e.id]||(e.ts||0)>(m[e.id].ts||0))m[e.id]=e});return Object.values(m)}
function sig(d){return JSON.stringify(['entries','kolommen','notities'].map(k=>[...(d[k]||[])].sort((x,y)=>x.id<y.id?-1:1)))}
function later(){setStatus('Nog niet verstuurd…');clearTimeout(timer);timer=setTimeout(sync,1500)}
async function sync(){
  if(bezig){nogEens=true;return}
  if(!cfg.owner||!cfg.repo){setStatus('Alleen op dit apparaat');standaardRegels();render();return}
  bezig=true;setStatus('Bezig…');
  try{
    let msg='✓ '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    for(let i=0;i<3;i++){
      const rem=await ghGet(),rd=rem.data;
      const m={entries:merge(rd.entries,db.entries),kolommen:merge(rd.kolommen,db.kolommen),notities:merge(rd.notities,db.notities)};
      db=m;bewaarLokaal();
      if(sig(m)===sig(rd))break;
      if(!cfg.token){msg='Alleen lezen';break}
      try{await ghPut(m,rem.sha);break}
      catch(e){if((e.status===409||e.status===422)&&i<2)continue;throw e}
    }
    setStatus(msg);
    if(standaardRegels())later();
  }catch(e){setStatus('⚠ '+e.message)}
  bezig=false;render();
  if(nogEens){nogEens=false;sync()}
}
function standaardRegels(){
  if(db.kolommen.length||db.entries.length)return false;
  [['207',[1,2,3,4,5]],['250',[2,3,4,5,6]]].forEach(([l,afd])=>afd.forEach(a=>[1,2].forEach(v=>db.kolommen.push({id:uid(),ts:Date.now(),locatie:l,afdeling:String(a),vak:String(v)}))));
  bewaarLokaal();return true;
}

/* ---------- Gegevens ---------- */
function regels(){
  const m={};
  db.kolommen.filter(k=>!k.del).forEach(k=>m[key(k)]=k);
  db.entries.filter(e=>!e.del).forEach(e=>{if(!m[key(e)])m[key(e)]={locatie:e.locatie,afdeling:e.afdeling,vak:e.vak,afgeleid:true}});
  return Object.values(m).sort((a,b)=>cmp(a.locatie,b.locatie)||cmp(kaal(a.afdeling),kaal(b.afdeling))||cmp(kaal(a.vak),kaal(b.vak)));
}
function vervangenOud(d){const n=db.notities.find(x=>x.id==='n_'+d);return !!(n&&!n.del&&n.vervangen)}
function cellen(){ // laatste telling per week + vak
  const m={};
  db.entries.filter(e=>!e.del).forEach(e=>{const c=ywVanEntry(e)+'#'+key(e);if(!m[c]||e.ts>m[c].ts)m[c]=e});
  return m;
}
function bereken(c){
  const per={},res={};
  Object.values(c).forEach(e=>(per[key(e)]=per[key(e)]||[]).push(e));
  Object.values(per).forEach(l=>{
    l.sort((a,b)=>a.datum.localeCompare(b.datum)||ywVanEntry(a)-ywVanEntry(b));
    let p=null;
    l.forEach(e=>{
      const r={aantal:e.aantal,erbij:e.aantal,dag:null,vorige:p};
      if(p){
        const basis=(p.vervangen||vervangenOud(p.datum))?0:p.aantal;
        r.erbij=e.aantal-basis;if(r.erbij<0)r.erbij=e.aantal;
        const dg=days(p.datum,e.datum);r.dag=dg>0?r.erbij/dg:null;
      }
      res[e.id]=r;p=e;
    });
  });
  return res;
}
function schuifMax(){ // aantal weken vanaf de eerste telling tot nu (minstens 13)
  const nu=ywVan(today()),ys=db.entries.filter(e=>!e.del).map(ywVanEntry);
  if(!ys.length)return 13;
  const n=Math.round(days(maandagVan(Math.min(...ys,nu)),maandagVan(nu))/7)+1;
  return Math.max(13,n);
}
function weken(){
  const s=$('f_weken');s.max=schuifMax();
  const n=Math.min(+s.value,+s.max);$('f_wn').textContent=n;
  const nu=ywVan(today()),start=plusDagen(maandagVan(nu),-(n-1)*7);
  const l=[];for(let d=start;ywVan(d)<=nu;d=plusDagen(d,7))l.push(ywVan(d));
  return l;
}

/* ---------- Matrix ---------- */
function kleur(v,max){
  if(v==null)return '';
  const t=max>0?Math.min(1,v/max):0,g=[120,198,155],w=[255,255,255],r=[235,135,120];
  const [a,b,u]=t<.5?[g,w,t/.5]:[w,r,(t-.5)/.5];
  return `background:rgb(${a.map((x,i)=>Math.round(x+(b[i]-x)*u)).join(',')})`;
}
function waarde(e,res){if(!e)return null;const r=res[e.id];return modus==='stand'?e.aantal:modus==='erbij'?r.erbij:r.dag}
function vulFilter(){
  const locs=[...new Set(regels().map(k=>k.locatie))],f=$('f_loc'),c=f.value;
  f.innerHTML='<option value="">Alle locaties</option>'+locs.map(l=>`<option${l===c?' selected':''}>${esc(l)}</option>`).join('');
}
function render(){
  vulFilter();renderRegelLijst();
  const rs=regels().filter(k=>!$('f_loc').value||k.locatie===$('f_loc').value);
  const ws=weken(),nu=ywVan(today()),c=cellen(),res=bereken(c),dec=modus==='dag'?1:0;
  const vals=[];rs.forEach(k=>ws.forEach(w=>{const v=waarde(c[w+'#'+key(k)],res);if(v>0)vals.push(v)}));
  vals.sort((a,b)=>a-b);const max=vals.length?Math.max(1,vals[Math.floor(vals.length*.9)]):1;
  let h='<table class="m"><thead><tr><th class="sd">Vak</th>'+ws.map(w=>`<th${w===nu?' class="nu"':''}>${ywKort(w)}</th>`).join('')+'</tr></thead><tbody>';
  const tot={},locTot={};let vorigeLoc=null;
  const locs=[...new Set(rs.map(k=>k.locatie))];
  rs.forEach(k=>{
    h+=`<tr${vorigeLoc!==null&&vorigeLoc!==k.locatie?' class="sep"':''}><td class="sd">${esc(label(k))}</td>`;
    vorigeLoc=k.locatie;
    ws.forEach(w=>{
      const e=c[w+'#'+key(k)],v=waarde(e,res);
      if(v!=null){tot[w]=(tot[w]||0)+v;locTot[k.locatie+w]=(locTot[k.locatie+w]||0)+v}
      const mark=e&&(e.opm||e.vervangen);
      const txt=v==null?(e?'·':'—'):fmt(v,dec);
      h+=`<td class="c${v==null?' leeg':''}" style="${kleur(v,max)}" data-k="${esc(key(k))}" data-w="${w}"${e&&e.opm?` title="${esc(e.opm)}"`:''}>${mark?`<b>${txt}</b>`:txt}</td>`;
    });
    h+='</tr>';
  });
  if(locs.length>1)locs.forEach((l,i)=>{h+=`<tr class="tot${i===0?' sep':''}"><td class="sd">Totaal ${esc(l)}</td>`+ws.map(w=>`<td>${fmt(locTot[l+w],dec)||'—'}</td>`).join('')+'</tr>'});
  h+=`<tr class="tot${locs.length>1?'':' sep'}"><td class="sd">Totaal</td>`+ws.map(w=>`<td>${fmt(tot[w],dec)||'—'}</td>`).join('')+'</tr>';
  h+='</tbody></table>';
  const box=$('matrix'),sx=box.scrollLeft,sy=box.scrollTop;
  box.innerHTML=rs.length?h:'<p class="small" style="padding:12px">Nog geen regels. Voeg ze toe bij ⚙.</p>';
  if(scrollRechts){box.scrollLeft=box.scrollWidth;scrollRechts=false}else{box.scrollLeft=sx;box.scrollTop=sy}
}
function renderRegelLijst(){
  const k=regels();
  $('k_lijst').innerHTML=k.length?'<table class="kl">'+k.map(x=>`<tr><td>${esc(label(x))}</td><td style="text-align:right">${x.afgeleid?'<span class="small">uit tellingen</span>':`<button class="del" data-kol="${x.id}">✕</button>`}</td></tr>`).join('')+'</table>':'<p class="small">Nog geen regels.</p>';
}

/* ---------- Invoervenster ---------- */
function openVenster(k,w){
  const regel=regels().find(x=>key(x)===k);if(!regel)return;
  const c=cellen(),e=c[w+'#'+k],res=bereken(c);
  open={regel,w,e};
  $('v_titel').textContent=e?'Telling wijzigen':'Nieuwe telling';
  $('v_tags').innerHTML=`<span class="tag">Week ${ywKort(w)}</span><span class="tag">Loc ${esc(regel.locatie)}</span><span class="tag">Afd ${esc(kaal(regel.afdeling))}</span><span class="tag">Vak ${esc(kaal(regel.vak))}</span>`;
  $('v_datum').value=standaardDatum(e,w,c);
  $('v_aantal').value=e?e.aantal:'';
  $('v_vv').checked=!!(e&&e.vervangen);
  $('v_opm').value=e?e.opm||'':'';
  $('v_del').hidden=!e;
  // vorige stand
  const eerder=Object.values(c).filter(x=>key(x)===k&&ywVanEntry(x)<w).sort((a,b)=>ywVanEntry(b)-ywVanEntry(a))[0];
  const vh=$('v_vorige');
  if(eerder){
    const vv=eerder.vervangen||vervangenOud(eerder.datum);
    open.basis=vv?0:eerder.aantal;
    $('v_vorig').textContent=fmt(open.basis,1);
    vh.textContent=`Vorige telling: week ${ywKort(ywVanEntry(eerder))} (${nlDate(eerder.datum)}), stand ${fmt(eerder.aantal,1)}`+(vv?' – val toen vervangen, dus nu vanaf 0':'');
  }else{
    open.basis=0;$('v_vorig').textContent='0';
    vh.textContent='Eerste telling voor dit vak. De val begint op 0.';
  }
  rekenTelling();
  checkDatum();
  $('venster').classList.add('on');
  setTimeout(()=>$('v_aantal').focus(),50);
}
function checkDatum(){
  const d=$('v_datum').value,el=$('v_warn');
  if(open&&d&&ywVan(d)!==open.w){el.hidden=false;el.textContent=`Let op: deze datum valt in week ${ywKort(ywVan(d))}.`}else el.hidden=true;
}
function standaardDatum(e,w,c){
  if(e)return e.datum;                                  // al ingevuld: eigen datum
  const zelfdeWeek=Object.values(c).filter(x=>ywVanEntry(x)===w).sort((a,b)=>b.ts-a.ts)[0];
  if(zelfdeWeek)return zelfdeWeek.datum;                // andere vakken in deze week: zelfde datum
  if(w===ywVan(today()))return today();                 // huidige week: vandaag
  return plusDagen(maandagVan(w),2);                    // oude week: woensdag
}
function rekenTelling(){
  const raw=$('v_aantal').value.trim().replace(',','.'),n=Number(raw),el=$('v_tel');
  if(!open||raw===''||isNaN(n)){el.textContent='–';el.style.color='';return}
  let t=n-open.basis;
  if(t<0){el.textContent=fmt(n,1);el.style.color='var(--red)';el.title='Stand is lager dan vorige keer: gerekend als nieuwe val';return}
  el.style.color='';el.title='';el.textContent=fmt(t,1);
}
$('v_aantal').addEventListener('input',rekenTelling);
function sluit(){$('venster').classList.remove('on');open=null}
$('v_datum').addEventListener('input',checkDatum);
$('v_sluit').onclick=sluit;
$('venster').addEventListener('click',ev=>{if(ev.target.id==='venster')sluit()});
document.addEventListener('keydown',ev=>{if(!open)return;if(ev.key==='Escape')sluit();if(ev.key==='Enter'&&ev.target.tagName==='INPUT')$('v_ok').click()});
$('v_ok').onclick=()=>{
  const d=$('v_datum').value,raw=$('v_aantal').value.trim().replace(',','.'),n=Number(raw);
  if(!d){alert('Vul een datum in.');return}
  if(raw===''||isNaN(n)||n<0){alert('Vul een geldig aantal in.');$('v_aantal').focus();return}
  const {regel,w,e}=open,nu=Date.now();
  const velden={datum:d,yw:w,aantal:n,vervangen:$('v_vv').checked,opm:$('v_opm').value.trim()};
  if(e)Object.assign(e,velden,{ts:nu});
  else db.entries.push(Object.assign({id:uid(),ts:nu,locatie:regel.locatie,afdeling:kaal(regel.afdeling),vak:kaal(regel.vak)},velden));
  bewaarLokaal();sluit();render();later();
};
$('v_del').onclick=()=>{
  if(!open||!open.e||!confirm('Deze telling verwijderen?'))return;
  const k=key(open.e),w=open.w,nu=Date.now();
  db.entries.filter(x=>!x.del&&key(x)===k&&ywVanEntry(x)===w).forEach(x=>{x.del=true;x.ts=nu});
  bewaarLokaal();sluit();render();later();
};
$('matrix').addEventListener('click',ev=>{const td=ev.target.closest('td.c');if(td)openVenster(td.dataset.k,+td.dataset.w)});

/* ---------- Overige acties ---------- */
$('modus').onclick=ev=>{const m=ev.target.dataset.m;if(!m)return;modus=m;document.querySelectorAll('#modus button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));render()};
$('f_loc').onchange=render;
$('f_weken').oninput=()=>{scrollRechts=true;render()};
$('ververs').onclick=sync;
$('tandwiel').onclick=()=>$('instellingen').classList.toggle('on');
$('bewaar').onclick=()=>{
  ['owner','repo','branch','path','token'].forEach(k=>cfg[k]=$('c_'+k).value.trim());
  if(!cfg.branch)cfg.branch='main';if(!cfg.path)cfg.path='data.json';
  lsSet(LS_CFG,cfg);$('instellingen').classList.remove('on');sync();
};
$('k_add').onclick=()=>{
  const k={id:uid(),ts:Date.now(),locatie:$('k_loc').value.trim(),afdeling:kaal($('k_afd').value),vak:kaal($('k_vak').value)};
  if(!k.locatie||!k.afdeling||!k.vak){alert('Vul locatie, afdeling en vak in.');return}
  if(regels().some(x=>key(x)===key(k))){alert('Deze regel bestaat al.');return}
  db.kolommen.push(k);bewaarLokaal();$('k_vak').value='';render();later();
};
$('k_lijst').onclick=ev=>{
  const id=ev.target.dataset.kol;if(!id)return;
  const k=db.kolommen.find(x=>x.id===id);
  if(!confirm(`Regel ${label(k)} weghalen? (Tellingen blijven bewaard.)`))return;
  k.del=true;k.ts=Date.now();bewaarLokaal();render();later();
};
$('csv').onclick=()=>{
  const rs=regels().filter(k=>!$('f_loc').value||k.locatie===$('f_loc').value);
  const ws=weken(),c=cellen(),res=bereken(c);
  const n=v=>v==null?'':String(Math.round(v*100)/100).replace('.',',');
  let t='Vak;'+ws.map(ywKort).join(';')+'\n';
  rs.forEach(k=>t+=label(k)+';'+ws.map(w=>n(waarde(c[w+'#'+key(k)],res))).join(';')+'\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download=`trips-${modus}.csv`;a.click();
};

/* ---------- Start ---------- */
['owner','repo','branch','path','token'].forEach(k=>$('c_'+k).value=cfg[k]);
if(!cfg.owner||!cfg.repo)$('instellingen').classList.add('on');
render();sync();
</script>
</body>
</html>
