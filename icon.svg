<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7f58"/><stop offset="1" stop-color="#245a3c"/></linearGradient>
    <linearGradient id="pl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb0ff"/><stop offset="1" stop-color="#1f6fe0"/></linearGradient>
    <g id="trips">
      <!-- vleugels: smal met franje -->
      <g stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round" opacity=".85" transform="translate(0 2) scale(.75 -1.05)">
        <path d="M0 -6 L-20 -46" /><path d="M0 -6 L20 -46"/>
        <path d="M-5 -16 l-6 -2 M-8 -24 l-6 -2 M-11 -32 l-6 -2 M-14 -40 l-6 -2"/>
        <path d="M5 -16 l6 -2 M8 -24 l6 -2 M11 -32 l6 -2 M14 -40 l6 -2"/>
      </g>
      <!-- lijf -->
      <ellipse cx="0" cy="0" rx="7" ry="10" fill="#141414"/>
      <ellipse cx="0" cy="-12" rx="5.5" ry="6" fill="#141414"/>
      <path d="M-6 6 Q-7 30 0 46 Q7 30 6 6 Z" fill="#1e1e1e"/>
      <!-- voelsprieten -->
      <path d="M-2 -17 L-8 -30 M2 -17 L8 -30" stroke="#141414" stroke-width="2.5" stroke-linecap="round"/>
      <!-- pootjes -->
      <path d="M-6 -2 l-11 -6 M-6 4 l-12 4 M6 -2 l11 -6 M6 4 l12 4" stroke="#141414" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- vangplaat -->
  <g transform="rotate(-8 256 270)">
    <rect x="118" y="96" width="276" height="340" rx="20" fill="#1b4430" opacity=".35" transform="translate(10 14)"/>
    <rect x="118" y="96" width="276" height="340" rx="20" fill="url(#pl)"/>
    <!-- ophanggaatje -->
    <circle cx="256" cy="126" r="11" fill="#2f6b4a"/>
    <!-- rasterlijnen -->
    <g stroke="#0e4aa8" stroke-width="3" opacity=".5">
      <path d="M118 176 H394 M118 240 H394 M118 304 H394 M118 368 H394"/>
      <path d="M187 146 V436 M256 146 V436 M325 146 V436"/>
    </g>
    <use href="#trips" transform="translate(196 222) rotate(-20) scale(1.25)"/>
    <use href="#trips" transform="translate(304 300) rotate(35) scale(1.1)"/>
    <use href="#trips" transform="translate(212 372) rotate(-70) scale(.95)"/>
  </g>
</svg>
